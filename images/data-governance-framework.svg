<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="640" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#1F2933">Data Governance</text>
  <text x="480" y="74" text-anchor="middle" font-size="15" fill="#52606D">Who decides, who is accountable, and how data is protected, used and kept fit for purpose</text>

  <!-- Outer ring: Compliance & Audit -->
  <rect x="30" y="98" width="900" height="514" rx="18" fill="#E8F1F7" stroke="#2B6A8E" stroke-width="3"/>
  <text x="480" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#2B6A8E" letter-spacing="1">COMPLIANCE &amp; AUDIT</text>
  <text x="480" y="156" text-anchor="middle" font-size="13.5" fill="#33505F">Demonstrate to regulators, auditors and customers that the controls below meet laws, standards, contracts and policy</text>

  <!-- Pillar 1: Data Security -->
  <rect x="60" y="178" width="270" height="272" rx="10" fill="#ffffff" stroke="#2E8B6E" stroke-width="2"/>
  <path d="M60 188 a10 10 0 0 1 10 -10 h250 a10 10 0 0 1 10 10 v46 h-270 z" fill="#2E8B6E"/>
  <text x="195" y="214" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Data Security</text>
  <text x="195" y="264" text-anchor="middle" font-size="14" font-style="italic" fill="#3E4C59">Is data protected from</text>
  <text x="195" y="282" text-anchor="middle" font-size="14" font-style="italic" fill="#3E4C59">unauthorized access?</text>
  <g font-size="14" fill="#1F2933">
    <text x="84" y="318">• CIA triad</text>
    <text x="84" y="344">• Access control and MFA</text>
    <text x="84" y="370">• Encryption at rest / in transit</text>
    <text x="84" y="396">• Logging and monitoring</text>
    <text x="84" y="422">• Backup and recovery</text>
  </g>

  <!-- Pillar 2: Data Privacy -->
  <rect x="345" y="178" width="270" height="272" rx="10" fill="#ffffff" stroke="#C99A1E" stroke-width="2"/>
  <path d="M345 188 a10 10 0 0 1 10 -10 h250 a10 10 0 0 1 10 10 v46 h-270 z" fill="#E2B33C"/>
  <text x="480" y="214" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2933">Data Privacy</text>
  <text x="480" y="264" text-anchor="middle" font-size="14" font-style="italic" fill="#3E4C59">Is personal data used</text>
  <text x="480" y="282" text-anchor="middle" font-size="14" font-style="italic" fill="#3E4C59">only as authorized?</text>
  <g font-size="14" fill="#1F2933">
    <text x="369" y="318">• Lawful basis and consent</text>
    <text x="369" y="344">• Purpose limitation</text>
    <text x="369" y="370">• Data minimization</text>
    <text x="369" y="396">• Retention and deletion</text>
    <text x="369" y="422">• Data subject rights</text>
  </g>

  <!-- Pillar 3: Data Quality -->
  <rect x="630" y="178" width="270" height="272" rx="10" fill="#ffffff" stroke="#5B5FC7" stroke-width="2"/>
  <path d="M630 188 a10 10 0 0 1 10 -10 h250 a10 10 0 0 1 10 10 v46 h-270 z" fill="#5B5FC7"/>
  <text x="765" y="214" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Data Quality</text>
  <text x="765" y="264" text-anchor="middle" font-size="14" font-style="italic" fill="#3E4C59">Is data correct and</text>
  <text x="765" y="282" text-anchor="middle" font-size="14" font-style="italic" fill="#3E4C59">fit for purpose?</text>
  <g font-size="14" fill="#1F2933">
    <text x="654" y="318">• Accuracy, completeness</text>
    <text x="654" y="344">• Consistency, uniqueness</text>
    <text x="654" y="370">• Integrity, validity</text>
    <text x="654" y="396">• Timeliness (per SLA)</text>
    <text x="654" y="422">• Monitoring and DQ score</text>
  </g>

  <!-- Foundation -->
  <rect x="60" y="470" width="840" height="120" rx="12" fill="#2F3B4A"/>
  <text x="480" y="500" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="1">GOVERNANCE FOUNDATION</text>
  <line x1="340" y1="518" x2="340" y2="574" stroke="#52606D" stroke-width="1"/>
  <line x1="620" y1="518" x2="620" y2="574" stroke="#52606D" stroke-width="1"/>
  <text x="200" y="540" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Ownership &amp; stewardship</text>
  <text x="200" y="562" text-anchor="middle" font-size="13" fill="#CBD2D9">Owners, stewards, decision rights</text>
  <text x="480" y="540" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Policies &amp; standards</text>
  <text x="480" y="562" text-anchor="middle" font-size="13" fill="#CBD2D9">Classification, data contracts, SLAs</text>
  <text x="760" y="540" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Metadata &amp; lineage</text>
  <text x="760" y="562" text-anchor="middle" font-size="13" fill="#CBD2D9">Catalog, PII tags, lineage, DQ results</text>
</svg>
